# go-nginx-proxy: access log format that puts $host first so the manager can
# group traffic by domain. Installed by deploy/install.sh into conf.d.
# The format is identical to nginx combined plus a leading $host field.
log_format proxy_logged '$host $remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
